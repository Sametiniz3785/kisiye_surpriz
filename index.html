<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seni Seviyorum ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      /* Parlak, zengin lacivert zemin */
      background: radial-gradient(circle at 50% 40%, #1a3a6c 0%, #0a1931 50%, #030811 100%);
      height: 100vh;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    #message-container {
      position: absolute;
      bottom: 15%;
      width: 90%;
      text-align: center;
      z-index: 2;
      min-height: 80px;
    }

    #text {
      color: #e6f0ff;
      font-size: 1.5rem;
      font-weight: 300;
      line-height: 1.6;
      letter-spacing: 0.5px;
      text-shadow: 0 0 15px rgba(100, 150, 255, 0.6);
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.2rem;
      background-color: #e6f0ff;
      margin-left: 4px;
      animation: blink 0.7s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>
  
  <div id="message-container">
    <div id="text"></div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Ekran boyutunu ayarla
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const shards = [];
    const numShards = 550; // Cam parçası sayısı
    // Parlak lacivert cam tonları
    const colors = ['#2b5c9e', '#1c457d', '#113260', '#3b74c4', '#0d2547'];

    // Kalp şeklinin içini dolduran noktalar üretme
    for(let i = 0; i < numShards; i++) {
      let x, y;
      let isInside = false;
      while(!isInside) {
        let px = (Math.random() * 3) - 1.5;
        let py = (Math.random() * 3) - 1.5;
        // Kalp denklemi
        if (Math.pow(px*px + py*py - 1, 3) - px*px * py*py*py <= 0) {
          x = px; y = py; isInside = true;
        }
      }
      
      let scale = Math.min(canvas.width, canvas.height) / 3;
      // Merkez ve Y eksenini ters çevirip hizalama
      let targetX = canvas.width / 2 + x * scale;
      let targetY = canvas.height / 2 - y * scale - (scale * 0.2);
      
      // Cam parçalarını ekran dışından rastgele yerlerden başlat
      let angle = Math.random() * Math.PI * 2;
      let dist = Math.max(canvas.width, canvas.height) * 1.2;
      let startX = canvas.width / 2 + Math.cos(angle) * dist;
      let startY = canvas.height / 2 + Math.sin(angle) * dist;

      shards.push({
        startX: startX, startY: startY,
        targetX: targetX, targetY: targetY,
        x: startX, y: startY,
        size: Math.random() * 6 + 3,
        rot: Math.random() * Math.PI * 2,
        targetRot: Math.random() * Math.PI, 
        color: colors[Math.floor(Math.random() * colors.length)],
        delay: Math.random() * 3000 // Parçaların geliş süresi farklılıkları
      });
    }

    let startTime = null;
    const duration = 6500; // 6.5 saniyede yavaşça birleşme
    let textStarted = false;

    // Daktilo efekti fonksiyonu
    const message = "Ben de seni çok seviyorum. Sen de benim için en güzel şeysin.";
    let charIndex = 0;
    const textElement = document.getElementById('text');
    
    function typeWriter() {
      if (charIndex < message.length) {
        textElement.innerHTML = message.substring(0, charIndex + 1) + '<span class="cursor"></span>';
        charIndex++;
        setTimeout(typeWriter, 60); // Yazma hızı (ms)
      } else {
        textElement.innerHTML = message + '<span class="cursor"></span>';
      }
    }

    // Animasyon Döngüsü
    function animate(timestamp) {
      if(!startTime) startTime = timestamp;
      let elapsed = timestamp - startTime;
      let overallProgress = Math.min(elapsed / duration, 1);
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      shards.forEach(s => {
        // Her parçanın kendi gecikmesine göre ilerlemesi
        let p = Math.max(0, Math.min((elapsed - s.delay) / (duration - s.delay), 1));
        // Yumuşak frenleme efekti (easeOutQuart)
        let ease = 1 - Math.pow(1 - p, 4);
        
        s.x = s.startX + (s.targetX - s.startX) * ease;
        s.y = s.startY + (s.targetY - s.startY) * ease;
        let currentRot = s.rot + (s.targetRot - s.rot) * ease;

        // Cam parçası çizimi
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(currentRot);
        ctx.fillStyle = s.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(20, 80, 180, 0.5)';
        ctx.beginPath();
        ctx.moveTo(0, -s.size);
        ctx.lineTo(s.size * 0.866, s.size * 0.5);
        ctx.lineTo(-s.size * 0.866, s.size * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });

      // Kalp neredeyse birleştiğinde (%85) yazıyı yazmaya başla
      if (overallProgress > 0.85 && !textStarted) {
        textStarted = true;
        typeWriter();
      }

      if (overallProgress < 1) {
        requestAnimationFrame(animate);
      } else {
        // Birleşme bitince kalbe hafif atış (pulse) efekti ver
        pulseHeart();
      }
    }

    // Birleşme bittikten sonra hafifçe kalp atışı efekti
    function pulseHeart() {
      let time = Date.now() * 0.002;
      let beatScale = 1 + Math.sin(time) * 0.02;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      let centerX = canvas.width / 2;
      let centerY = canvas.height / 2 - (Math.min(canvas.width, canvas.height) / 3 * 0.2);

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.scale(beatScale, beatScale);
      ctx.translate(-centerX, -centerY);

      shards.forEach(s => {
        ctx.save();
        ctx.translate(s.targetX, s.targetY);
        ctx.rotate(s.targetRot);
        ctx.fillStyle = s.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(30, 100, 220, 0.6)';
        ctx.beginPath();
        ctx.moveTo(0, -s.size);
        ctx.lineTo(s.size * 0.866, s.size * 0.5);
        ctx.lineTo(-s.size * 0.866, s.size * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });
      ctx.restore();

      requestAnimationFrame(pulseHeart);
    }

    // Animasyonu başlat
    requestAnimationFrame(animate);

    // Ekran boyutu değişirse sayfayı yenile
    window.addEventListener('resize', () => location.reload());
  </script>
</body>
</html>
